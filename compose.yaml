
services:
  db:
    image: postgres:18
    container_name: shopstack-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: shopstack_db
    ports:
      - "5433:5432"
    volumes:
      - shopstack_pgdata:/var/lib/postgresql

  api:
    build: .
    container_name: shopstack-container
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: shopstack_restore
    depends_on:
      - db

volumes:
  shopstack_pgdata:
