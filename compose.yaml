
services:
  db:
    image: postgres:18
    container_name: shopstack-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: shopstack_db
    ports:
      - "5433:5432"
    volumes:
      - shopstack_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shopstack_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: .
    container_name: shopstack-container
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: shopstack_restore
    depends_on:
      db:
        condition: service_healthy

  cart:
    image: python:3.11-slim
    container_name: shopstack-cart
    working_dir: /app
    volumes:
      - ./cart_service:/app
      - ./db.py:/app/db.py:ro
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python -m uvicorn app:app --host 0.0.0.0 --port 8001"
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: shopstack_restore
      PRODUCT_API: http://api:8000
    depends_on:
      db:
        condition: service_healthy

volumes:
  shopstack_pgdata:
